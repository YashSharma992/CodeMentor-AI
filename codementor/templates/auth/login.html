{% extends "base.html" %}{% block title %}Sign in · CodeMentor AI{% endblock %}
{% block content %}<section class="auth-card"><a class="brand auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">C</span><span>CodeMentor<span class="brand-ai"> AI</span></span></a><p class="eyebrow">YOUR DSA WORKSPACE</p><h1>Welcome back.</h1><p class="muted">Pick up where your problem solving left off.</p>
<form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="identity">Username or email</label><input class="form-control" id="identity" name="identity" required autocomplete="username" maxlength="255"><label class="form-label mt-3" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="remember" name="remember"><label class="form-check-label" for="remember">Keep me signed in</label></div><button class="btn btn-primary w-100 mt-4" type="submit">Sign in <span aria-hidden="true">→</span></button></form><p class="auth-switch">New to CodeMentor? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
